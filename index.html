<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDT Portal – Uttara University</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e40af">
<link rel="icon" type="image/png" href="/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#1e40af;--primary-light:#3b82f6;--bg:#f1f5f9;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--danger:#dc2626;--success:#16a34a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:6px;padding:8px 14px;font-size:14px}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;width:100%;background:#fff;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-light);border-color:transparent}
a{color:var(--primary);text-decoration:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-light)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:4px 10px;font-size:12px}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#1e40af,#3b82f6)}
.auth-card{background:#fff;border-radius:12px;padding:32px;width:100%;max-width:440px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.auth-card h1{font-size:22px;margin-bottom:6px;color:var(--primary)}
.auth-card p.sub{color:var(--muted);margin-bottom:20px;font-size:13px}
.field{margin-bottom:14px}
.field label{display:block;margin-bottom:5px;font-weight:500;font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{padding:8px 12px;background:none;border-radius:0;color:var(--muted);border-bottom:2px solid transparent}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.err{color:var(--danger);font-size:12px;margin-top:8px;min-height:16px}
.hint{font-size:11.5px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.7}
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:#0f172a;color:#cbd5e1;padding:16px 0;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:50;transition:transform .2s}
.sidebar h2{color:#fff;font-size:16px;padding:0 20px 16px;border-bottom:1px solid #1e293b;margin-bottom:12px}
.sidebar h2 small{display:block;color:#94a3b8;font-size:11px;font-weight:400;margin-top:3px}
.nav-item{display:block;padding:10px 20px;color:#cbd5e1;font-size:13.5px;cursor:pointer;border-left:3px solid transparent}
.nav-item:hover{background:#1e293b;color:#fff}
.nav-item.active{background:#1e293b;color:#fff;border-left-color:var(--primary-light);font-weight:600}
.nav-section{padding:12px 20px 4px;font-size:10.5px;text-transform:uppercase;color:#64748b;letter-spacing:.5px}
.main{flex:1;margin-left:240px;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.topbar h1{font-size:18px}
.user-info{display:flex;align-items:center;gap:12px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.content{padding:24px;flex:1}
.menu-btn{display:none;background:none;font-size:22px;padding:4px 8px;color:var(--text)}
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px}
.card h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.stat{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px}
.stat .num{font-size:28px;font-weight:700;color:var(--primary)}
.stat .lbl{font-size:12.5px;color:var(--muted);margin-top:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-green{background:#dcfce7;color:#166534}
.badge-orange{background:#ffedd5;color:#9a3412}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-gray{background:#e2e8f0;color:#475569}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:#f8fafc;font-weight:600;color:#475569;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px}
tr:hover td{background:#f8fafc}
.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:10px}
.pin{background:#fef3c7;border-left:3px solid #f59e0b;padding:10px 14px;border-radius:6px;margin-bottom:10px}
.pin b{display:block;margin-bottom:3px;color:#92400e}
.list-item{padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}
.list-item:last-child{border-bottom:none}
.list-item .meta{font-size:12px;color:var(--muted);margin-top:3px}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.section-head h2{font-size:20px}
.section-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
.sem-select{display:flex;align-items:center;gap:10px;font-size:13px}
.sem-select select{width:auto;min-width:150px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:10px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;padding:24px}
.modal h3{font-size:17px;margin-bottom:16px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.row{display:flex;gap:10px}
.row>*{flex:1}
@media(max-width:768px){
.sidebar{transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.main{margin-left:0}
.menu-btn{display:block}
}
.loader{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--muted);font-size:14px}
.search-box{position:relative;flex:1;max-width:400px;margin:0 16px}
.search-box input{padding-left:32px}
.search-box::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none}
.search-results{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;margin-top:4px;max-height:300px;overflow-y:auto;z-index:60;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.search-results .item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px}
.search-results .item:hover{background:#f1f5f9}
.search-results .item .type{font-size:10px;color:var(--muted);text-transform:uppercase}
.stops-list{display:flex;flex-direction:column;gap:6px}
.stop-row{display:flex;gap:8px;align-items:center}
.stop-row input[type="text"]{flex:2}
.stop-row input[type="time"]{flex:1}
.stop-row .remove-stop{background:var(--danger);color:#fff;padding:6px 10px;font-size:12px;flex:0 0 auto}
.stops-display{font-size:12px;line-height:1.6;margin:0;padding-left:16px}
.stops-display li{margin-bottom:2px}
.stops-display li b{color:var(--primary);font-weight:600}
</style>
</head>
<body>
<div id="root"><div class="loader">Loading...</div></div>
<script>
/* ============================================================
   FDT Portal – Uttara University
   Supabase-integrated
   ============================================================ */
const SUPABASE_URL = 'https://nvctukcnljpkcgnedici.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52Y3R1a2NubGpwa2NnbmVkaWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMzA3NDUsImV4cCI6MjEwNDYwNjc0NX0.1q_VZ3LxGtfUhmlOnbO0zxysdlu8hNsW0MFonRj3P7g';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let state = {
  user: null, profile: null, route: 'dashboard', adminRoute: 'admin-dashboard',
  sidebarOpen: false, semFilter: 'Fall 2026', modal: null, loading: true,
  searchQuery: '', searchResults: [], calSemFilter: 'all'
};

const $ = s => document.querySelector(s);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function todayName(){ return DAYS[new Date().getDay()]; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return '—'; const d=new Date(s); if(isNaN(d)) return s; return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtTime(t){ return t ? String(t).slice(0,5) : '—'; }
function gradePoint(g){ const m={'A+':4,'A':3.75,'A-':3.5,'B+':3.25,'B':3,'B-':2.75,'C+':2.5,'C':2.25,'D':2,'F':0}; return m[g]||0; }
function toast(msg){ const t=document.createElement('div'); t.textContent=msg;
  t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:8px;z-index:200;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2)';
  document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }

/* ---------- DATA CACHE ---------- */
let CACHE = { teachers:[], staff:[], courses:[], registered:[], routines:[], events:[], buses:[], results:[], materials:[], notices:[], attendance:[], assignments:[], submissions:[], profiles:[], calendar:[] };

async function loadAllData(){
  state.loading = true;
  const [teachers, staff, courses, routines, events, buses, materials, notices, calendar] = await Promise.all([
    db.from('teachers').select('*').order('name'),
    db.from('staff').select('*').order('name'),
    db.from('courses').select('*').order('code'),
    db.from('routines').select('*'),
    db.from('events').select('*').order('date'),
    db.from('buses').select('*').order('bus_number'),
    db.from('materials').select('*').order('upload_date',{ascending:false}),
    db.from('notices').select('*').order('date',{ascending:false}),
    db.from('academic_calendar').select('*').order('start_date')
  ]);
  CACHE.teachers = teachers.data||[];
  CACHE.staff = staff.data||[];
  CACHE.courses = courses.data||[];
  CACHE.routines = routines.data||[];
  CACHE.events = events.data||[];
  CACHE.buses = buses.data||[];
  CACHE.materials = materials.data||[];
  CACHE.notices = notices.data||[];
  CACHE.calendar = calendar.data||[];
  if(state.profile){
    const [reg, res, att, asg, sub] = await Promise.all([
      db.from('registered_courses').select('*').eq('student_id', state.profile.id),
      db.from('results').select('*').eq('student_id', state.profile.id),
      db.from('attendance').select('*').eq('student_id', state.profile.id),
      db.from('assignments').select('*').order('due_date'),
      db.from('submissions').select('*').eq('student_id', state.profile.id)
    ]);
    CACHE.registered = reg.data||[];
    CACHE.results = res.data||[];
    CACHE.attendance = att.data||[];
    CACHE.assignments = asg.data||[];
    CACHE.submissions = sub.data||[];
    if(state.profile.role==='admin'){
      const { data: profiles } = await db.from('profiles').select('*').order('name');
      CACHE.profiles = profiles||[];
    }
  }
  state.loading = false;
}

function teacherName(id){ const t = CACHE.teachers.find(x=>x.id===id); return t ? t.name : '—'; }
function courseById(id){ return CACHE.courses.find(c=>c.id===id); }
function courseLabel(id){ const c=courseById(id); return c ? c.code+' – '+c.title : '—'; }
function studentName(id){ const p = CACHE.profiles.find(x=>x.id===id); return p ? p.name : '—'; }

/* ---------- AUTH ---------- */
async function initAuth(){
  const { data: { session } } = await db.auth.getSession();
  if(session){
    state.user = session.user;
    const { data: profile } = await db.from('profiles').select('*').eq('id', session.user.id).single();
    state.profile = profile;
    if(profile) state.route = profile.role==='admin' ? 'admin-dashboard' : 'dashboard';
  }
  state.loading = false;
  render();
  db.auth.onAuthStateChange(async (event, session) => {
    if(event==='SIGNED_IN' && session){
      state.user = session.user;
      const { data: profile } = await db.from('profiles').select('*').eq('id', session.user.id).single();
      state.profile = profile;
      if(profile) state.route = profile.role==='admin' ? 'admin-dashboard' : 'dashboard';
      await loadAllData();
      subscribeRealtime();
      render();
    } else if(event==='SIGNED_OUT'){
      state.user = null; state.profile = null; render();
    }
  });
}

let realtimeChannel = null;
function subscribeRealtime(){
  if(realtimeChannel) db.removeChannel(realtimeChannel);
  realtimeChannel = db.channel('portal-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'notices' }, () => loadAllData().then(render))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'routines' }, () => loadAllData().then(render))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, () => loadAllData().then(render))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'buses' }, () => loadAllData().then(render))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'academic_calendar' }, () => loadAllData().then(render))
    .subscribe();
}

/* ---------- RENDER ---------- */
function render(){
  if(state.loading){ $('#root').innerHTML = '<div class="loader">Loading...</div>'; return; }
  if(!state.user || !state.profile){ $('#root').innerHTML = renderAuth(); return; }
  $('#root').innerHTML = state.profile.role==='admin' ? renderAdminLayout() : renderStudentLayout();
  bindNav();
  bindSearch();
}
function bindNav(){
  document.querySelectorAll('[data-route]').forEach(el=>{
    el.onclick = () => {
      const r = el.getAttribute('data-route');
      if(state.profile.role==='admin') state.adminRoute=r; else state.route=r;
      state.sidebarOpen=false; state.searchResults=[]; state.searchQuery=''; render();
    };
  });
  const mb = $('#menuBtn'); if(mb) mb.onclick = () => { state.sidebarOpen=!state.sidebarOpen; render(); };
}
function bindSearch(){
  const input = $('#globalSearch');
  if(!input) return;
  input.oninput = e => {
    const q = e.target.value.trim().toLowerCase();
    state.searchQuery = q;
    if(!q){ state.searchResults = []; }
    else { state.searchResults = globalSearch(q); }
    const container = $('#searchResults');
    if(container){
      container.innerHTML = state.searchResults.length
        ? state.searchResults.map((r,i)=>`<div class="item" onclick="app.goSearchResult(${i})"><span class="type">${esc(r.type)}</span><br>${esc(r.label)}</div>`).join('')
        : (q ? '<div class="item" style="color:var(--muted)">No results</div>' : '');
    }
  };
  document.addEventListener('click', e => {
    if(!e.target.closest('.search-box')){
      const c = $('#searchResults'); if(c) c.innerHTML='';
    }
  });
}
function globalSearch(query){
  const q = query.toLowerCase();
  const results = [];
  CACHE.courses.filter(c =>
    c.code.toLowerCase().includes(q) || c.title.toLowerCase().includes(q)
  ).forEach(c => results.push({ type:'Course', label:`${c.code} – ${c.title}`, route:'allcourses' }));
  CACHE.teachers.filter(t =>
    t.name.toLowerCase().includes(q) || (t.designation||'').toLowerCase().includes(q)
  ).forEach(t => results.push({ type:'Teacher', label:t.name, route:'teachers' }));
  CACHE.materials.filter(m =>
    m.title.toLowerCase().includes(q)
  ).forEach(m => results.push({ type:'Material', label:m.title, route:'materials' }));
  CACHE.notices.filter(n =>
    n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q)
  ).forEach(n => results.push({ type:'Notice', label:n.title, route:'dashboard' }));
  CACHE.staff.filter(s =>
    s.name.toLowerCase().includes(q)
  ).forEach(s => results.push({ type:'Staff', label:s.name, route:'staff' }));
  CACHE.calendar.filter(c =>
    c.title.toLowerCase().includes(q)
  ).forEach(c => results.push({ type:'Calendar', label:c.title, route:'calendar' }));
  return results.slice(0, 10);
}

/* ---------- AUTH PAGE ---------- */
let authTab = 'login';
function renderAuth(){
  return `<div class="auth-wrap"><div class="auth-card">
    <h1>FDT Portal</h1>
    <p class="sub">Fashion Design & Technology · Uttara University</p>
    <div class="tabs">
      <button class="tab ${authTab==='login'?'active':''}" onclick="app.setAuthTab('login')">Student Login</button>
      <button class="tab ${authTab==='signup'?'active':''}" onclick="app.setAuthTab('signup')">Sign Up</button>
      <button class="tab ${authTab==='admin'?'active':''}" onclick="app.setAuthTab('admin')">Admin</button>
    </div>
    <div id="authForm">${renderAuthForm()}</div>
    <div class="err" id="authErr"></div>
    <p class="hint">Sign up as a student to get started.<br>Admin access is granted from the Supabase dashboard.</p>
  </div></div>`;
}
function renderAuthForm(){
  if(authTab==='login') return `
    <div class="field"><label>Email</label><input id="li_email" type="email" placeholder="you@student.uttara.ac.bd"></div>
    <div class="field"><label>Password</label><input id="li_pass" type="password"></div>
    <button class="btn-primary" style="width:100%" onclick="app.doLogin()">Login</button>`;
  if(authTab==='signup') return `
    <div class="field"><label>Full Name</label><input id="su_name" type="text"></div>
    <div class="field"><label>Student ID</label><input id="su_sid" type="text" placeholder="FDT-2021-001"></div>
    <div class="field"><label>Email</label><input id="su_email" type="email"></div>
    <div class="row">
      <div class="field"><label>Semester</label>
        <select id="su_sem"><option>Fall 2026</option><option>Spring 2027</option><option>Summer 2027</option></select></div>
      <div class="field"><label>Batch</label><input id="su_batch" type="text" placeholder="2021"></div>
    </div>
    <div class="field"><label>Password</label><input id="su_pass" type="password"></div>
    <button class="btn-primary" style="width:100%" onclick="app.doSignup()">Create Account</button>`;
  return `
    <div class="field"><label>Admin Email</label><input id="li_email" type="email"></div>
    <div class="field"><label>Password</label><input id="li_pass" type="password"></div>
    <button class="btn-primary" style="width:100%" onclick="app.doLogin()">Admin Login</button>`;
}

/* ---------- STUDENT LAYOUT ---------- */
const STUDENT_NAV = [
  {k:'dashboard', label:'Dashboard'},
  {k:'calendar', label:'Academic Calendar'},
  {k:'routine', label:'Routine'},
  {k:'classes', label:'Classes'},
  {k:'attendance', label:'Attendance'},
  {k:'assignments', label:'Assignments'},
  {k:'events', label:'Events'},
  {k:'buses', label:'Bus Schedule'},
  {k:'registered', label:'Registered Courses'},
  {k:'allcourses', label:'All Courses'},
  {k:'teachers', label:'Teachers'},
  {k:'staff', label:'Staff'},
  {k:'result', label:'Live Result'},
  {k:'semresult', label:'Semester Result'},
  {k:'cgpa', label:'CGPA Calculator'},
  {k:'materials', label:'Study Material'},
  {k:'contact', label:'Contact Us'}
];
function renderStudentLayout(){
  const p = state.profile;
  return `<div class="app">
    <aside class="sidebar ${state.sidebarOpen?'open':''}">
      <h2>FDT Portal<small>Uttara University</small></h2>
      ${STUDENT_NAV.map(n=>`<div class="nav-item ${state.route===n.k?'active':''}" data-route="${n.k}">${n.label}</div>`).join('')}
      <div class="nav-section">Account</div>
      <div class="nav-item" onclick="app.logout()">Logout</div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px;flex:1">
          <button class="menu-btn" id="menuBtn">☰</button>
          <h1>${pageTitle(state.route)}</h1>
        </div>
        <div class="search-box">
          <input id="globalSearch" type="text" placeholder="Search courses, teachers, notices..." value="${esc(state.searchQuery)}">
          <div class="search-results" id="searchResults"></div>
        </div>
        <div class="user-info">
          <div class="avatar">${esc((p?.name||'S')[0])}</div>
          <div><div style="font-weight:600">${esc(p?.name||'')}</div>
          <div style="font-size:11px;color:var(--muted)">${esc(p?.student_id||'')}</div></div>
        </div>
      </div>
      <div class="content">${renderStudentPage()}</div>
    </div></div>`;
}

function pageTitle(k){
  const m = {dashboard:'Dashboard',calendar:'Academic Calendar',routine:'Routine',classes:'Classes',attendance:'Attendance',
    assignments:'Assignments',events:'Events',buses:'Bus Schedule',registered:'Registered Courses',
    allcourses:'All Courses',teachers:'Teachers',staff:'Staff',result:'Live Result',
    semresult:'Semester Result',cgpa:'CGPA Calculator',materials:'Study Material',contact:'Contact Us',
    'admin-dashboard':'Admin Dashboard','admin-calendar':'Manage Academic Calendar',
    'admin-events':'Manage Events','admin-buses':'Manage Buses',
    'admin-routines':'Manage Routine','admin-notices':'Manage Notices','admin-courses':'Manage Courses',
    'admin-teachers':'Manage Teachers','admin-staff':'Manage Staff','admin-materials':'Manage Study Materials',
    'admin-results':'Manage Results','admin-attendance':'Manage Attendance','admin-assignments':'Manage Assignments',

}

/* ---------- STUDENT PAGES ---------- */
function renderStudentPage(){
  switch(state.route){
    case 'dashboard': return pageDashboard();
    case 'calendar': return pageCalendar();
    case 'routine': return pageRoutine();
    case 'classes': return pageClasses();
    case 'attendance': return pageAttendance();
    case 'assignments': return pageAssignments();
    case 'events': return pageEvents();
    case 'buses': return pageBuses();
    case 'registered': return pageRegistered();
    case 'allcourses': return pageAllCourses();
    case 'teachers': return pageTeachers();
    case 'staff': return pageStaff();
    case 'result': return pageResult();
    case 'semresult': return pageSemResult();
    case 'cgpa': return pageCgpa();
    case 'materials': return pageMaterials();
    case 'contact': return pageContact();
    default: return pageDashboard();
  }
}

function pageDashboard(){

  const upcomingExams = CACHE.routines.filter(r=>['exam','quiz','presentation','assignment'].includes(r.type) && r.date && r.date>=todayStr())

    </div>
    <div class="grid grid-2">

        <h3>Today's Routine (${today})</h3>
        ${todayClasses.length ? todayClasses.map(r=>`
          <div class="list-item">
            <div><b>${esc(courseLabel(r.course_id))}</b>
              <div class="meta">${fmtTime(r.start_time)} – ${fmtTime(r.end_time)} · Room ${esc(r.room||'')}</div>
              <div class="meta">${esc(teacherName(r.teacher_id))}</div>
            </div>
            <span class="badge badge-blue">Class</span>
          </div>`).join('') : '<div class="empty">No classes today.</div>'}
      </div>
      <div class="card">
        <h3>Pinned Messages</h3>
        ${pinned.length ? pinned.map(n=>`
          <div class="pin"><b>${esc(n.title)}</b>
            <div style="font-size:12.5px;color:#78350f">${esc(n.content)}</div>
            <div style="font-size:11px;color:#a16207;margin-top:4px">${fmtDate(n.date)}</div>

      <h3>Recent Notices</h3>
      ${CACHE.notices.slice(0,5).map(n=>`

/* ---------- ACADEMIC CALENDAR PAGE ---------- */
function pageCalendar(){
  const today = todayStr();
  const catColors = {
    semester:'badge-blue', exam:'badge-red', registration:'badge-orange',
    holiday:'badge-green', event:'badge-blue', deadline:'badge-orange'
  };
  const catIcons = {
    semester:'📚', exam:'📝', registration:'📋', holiday:'🎉', event:'🎊', deadline:'⏰'
  };

  const semesters = [...new Set(CACHE.calendar.map(c=>c.semester||'General'))].sort();

  return `<div class="section-head">
      <div><h2>Academic Calendar</h2><div class="sub">All important semester dates at a glance</div></div>
      <div class="sem-select"><label>Semester:</label>
        <select onchange="app.setCalSem(this.value)">
          <option value="all">All Semesters</option>
          ${semesters.map(s=>`<option value="${esc(s)}" ${state.calSemFilter===s?'selected':''}>${esc(s)}</option>`).join('')}
        </select></div>
    </div>
    ${CACHE.calendar.length ? (() => {
      const filtered = state.calSemFilter && state.calSemFilter !== 'all'
        ? CACHE.calendar.filter(c => (c.semester||'General') === state.calSemFilter)
        : CACHE.calendar;
      
      const upcoming = filtered.filter(c => (c.end_date||c.start_date) >= today);
      const past = filtered.filter(c => (c.end_date||c.start_date) < today).reverse();

      const card = c => {
        const isRange = c.end_date && c.end_date !== c.start_date;
        const isToday = c.start_date <= today && (c.end_date ? c.end_date >= today : c.start_date === today);
        return `<div class="card" style="margin-bottom:10px;border-left:4px solid ${isToday?'var(--primary)':'var(--border)'}">
          <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
            <div style="flex:1;min-width:200px">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                <span style="font-size:18px">${catIcons[c.category]||'📅'}</span>
                <b style="font-size:14.5px">${esc(c.title)}</b>
                ${isToday ? '<span class="badge badge-green">Today</span>' : ''}
              </div>
              ${c.description ? `<div style="color:var(--muted);font-size:12.5px;margin-bottom:8px">${esc(c.description)}</div>` : ''}
              <div style="font-size:12.5px">
                📅 <b>${fmtDate(c.start_date)}</b>${isRange ? ` → <b>${fmtDate(c.end_date)}</b>` : ''}
                ${c.semester ? ` &nbsp;·&nbsp; 🎓 ${esc(c.semester)}` : ''}
              </div>
            </div>
            <span class="badge ${catColors[c.category]||'badge-gray'}">${esc(c.category||'event')}</span>
          </div>
        </div>`;
      };

      return `
        <h3 style="margin:6px 0 10px">Upcoming</h3>
        ${upcoming.length ? upcoming.map(card).join('') : '<div class="empty">No upcoming events.</div>'}
        <h3 style="margin:20px 0 10px">Past</h3>
        ${past.length ? past.map(card).join('') : '<div class="empty">No past events.</div>'}
      `;
    })() : '<div class="empty">No academic calendar entries yet.</div>'}`;
}

function pageSemResult(){
  const mine = CACHE.results;
  const semMap = {};
  mine.forEach(r=>{
    const reg = CACHE.registered.find(x=>x.student_id===state.profile.id && x.course_id===r.course_id);
    const sem = reg ? reg.semester : (state.profile.semester||'Unknown');
    (semMap[sem] = semMap[sem]||[]).push(r);
  });
  const sems = Object.keys(semMap).sort();
  let totalPoints=0,totalCredits=0;
  const rows = sems.map(sem=>{
    let pts=0,cr=0;
    semMap[sem].forEach(r=>{
      const c = courseById(r.course_id); const credit = c?Number(c.credits):3;
      pts += gradePoint(r.grade)*credit; cr += credit;
    });
    const gpa = cr ? pts/cr : 0;
    totalPoints += pts; totalCredits += cr;
    return {sem, gpa, credits:cr, courses:semMap[sem].length};
  });
  const cgpa = totalCredits ? totalPoints/totalCredits : 0;
  return `<div class="section-head"><div><h2>Semester Wise Result</h2></div></div>
    <div class="grid grid-2" style="margin-bottom:16px">
      <div class="stat"><div class="num">${cgpa.toFixed(2)}</div><div class="lbl">Overall CGPA</div></div>
      <div class="stat"><div class="num">${totalCredits}</div><div class="lbl">Total Credits</div></div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Semester</th><th>Courses</th><th>Credits</th><th>GPA</th></tr></thead>
      <tbody>${rows.length ? rows.map(r=>`<tr>
        <td>${esc(r.sem)}</td><td>${r.courses}</td><td>${r.credits}</td>
        <td><b>${r.gpa.toFixed(2)}</b></td></tr>`).join('') : `<tr><td colspan="4" class="empty">No result data.</td></tr>`}</tbody>
    </table></div>`;
}

function adminEntity(entity, title){
  const schema = SCHEMAS[entity];
  if(!schema) return '<div class="empty">Unknown entity.</div>';
  const list = CACHE[entity==='registered_courses'?'registered':entity] || [];
  return `<div class="section-head">
      <div><h2>${esc(title)}</h2><div class="sub">${list.length} record(s)</div></div>
      <button class="btn-primary" onclick="app.openModal('${entity}')">+ Add ${esc(schema.label)}</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr>${schema.columns.map(c=>`<th>${esc(schema.colLabels[c]||c)}</th>`).join('')}<th>Actions</th></tr></thead>
      <tbody>${list.length ? list.map(row=>`<tr>
        ${schema.columns.map(c=>{
          let v = row[c];
          if(schema.formatters && schema.formatters[c]) v = schema.formatters[c](v);
          else if(typeof v === 'boolean') v = v ? '✅' : '—';
          else if(c.includes('date') || c==='due_date') v = fmtDate(v);
          else v = esc(v == null || v === '' ? '—' : v);
          return `<td>${v}</td>`;
        }).join('')}
        <td>
          <button class="btn-sm btn-ghost" onclick="app.openModal('${entity}','${row.id}')">Edit</button>
          <button class="btn-sm btn-danger" onclick="app.deleteRecord('${entity}','${row.id}')">Delete</button>
        </td></tr>`).join('') : `<tr><td colspan="${schema.columns.length+1}" class="empty">No records.</td></tr>`}</tbody>
    </table></div>`;
}

function renderModal(){
  const {entity, record, mode} = state.modal;
  const schema = SCHEMAS[entity];
  if(!schema) return '';
  const isEdit = mode==='edit';
  const data = record || {};
  return `<div class="modal-bg" onclick="if(event.target===this) app.closeModal()">
    <div class="modal">
      <h3>${isEdit?'Edit':'Add'} ${esc(schema.label)}</h3>
      ${schema.fields.map(f=>renderField(f,data)).join('')}
      <div class="modal-actions">
        <button class="btn-ghost" onclick="app.closeModal()">Cancel</button>
        <button class="btn-primary" onclick="app.saveModal()">${isEdit?'Update':'Create'}</button>
      </div>
    </div></div>`;
}

function renderField(f, data){
  const v = data[f.k] != null ? data[f.k] : '';
  const id = 'fld_'+f.k;
  let input = '';
  if(f.type==='textarea') input = `<textarea id="${id}" rows="3">${esc(v)}</textarea>`;
  else if(f.type==='file') input = `<input id="${id}" type="file">
    ${data.file_name ? `<div style="font-size:12px;color:var(--muted);margin-top:4px">Current: ${esc(data.file_name)}</div>`:''}`;
  else if(f.type==='select'){
    let opts = [];
    if(f.optionsFrom){
      let arr = CACHE[f.optionsFrom]||[];
      if(f.filter) arr = arr.filter(f.filter);
      opts = arr.map(o=>({val:f.optionValue?f.optionValue(o):o, label:f.optionLabel?f.optionLabel(o):o}));
    } else opts = (f.options||[]).map(o=>({val:o,label:o}));
    input = `<select id="${id}">${opts.map(o=>`<option value="${esc(o.val)}" ${String(o.val)===String(v)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
  } else if(f.type==='checkbox') input = `<input id="${id}" type="checkbox" style="width:auto" ${v?'checked':''}>`;
  else if(f.type==='datetime-local'){
    const dv = v ? new Date(v).toISOString().slice(0,16) : '';
    input = `<input id="${id}" type="datetime-local" value="${dv}">`;
  }
  else if(f.type==='stops_list'){
    const stops = Array.isArray(v) ? v : [];
    input = `<div id="stops_container" class="stops-list">
        ${stops.map(s => `
          <div class="stop-row" data-stop-row>
            <input type="text" placeholder="Stop Name" value="${esc(s.name || '')}" class="stop-name">
            <input type="time" value="${esc(s.time || '')}" class="stop-time">
            <button type="button" class="remove-stop" onclick="this.parentElement.remove()">✕</button>
          </div>`).join('')}
      </div>
      <button type="button" class="btn-ghost btn-sm" style="margin-top:8px" onclick="app.addStopRow()">+ Add Stop</button>`;
  }
  else input = `<input id="${id}" type="${f.type}" value="${esc(v)}">`;
  return `<div class="field"><label>${esc(f.label)}${f.req?' *':''}</label>${input}</div>`;
}

/* ---------- FILE UPLOAD ---------- */
async function uploadStudyMaterial(file, courseId){
  const ext = file.name.split('.').pop();
  const fileName = `${courseId}/${Date.now()}.${ext}`;
  const { error } = await db.storage.from('study-materials').upload(fileName, file, {
    cacheControl:'3600', upsert:false, contentType:file.type
  });
  if(error){ toast('Upload failed: '+error.message); return null; }
  return { file_path:fileName, file_name:file.name, file_size:file.size };
}

async function uploadAssignment(file, assignmentId){
  const userId = state.profile.id;
  const ext = file.name.split('.').pop();
  const fileName = `${userId}/${assignmentId}.${ext}`;
  const { error } = await db.storage.from('assignments').upload(fileName, file, {
    cacheControl:'3600', upsert:true, contentType:file.type
  });
  if(error){ toast('Submission failed: '+error.message); return null; }
  return fileName;
}

window.app = {
  setAuthTab(t){ authTab=t; render(); },
  goSearchResult(i){
    const r = state.searchResults[i];
    if(!r) return;
    state.route = r.route; state.searchResults=[]; state.searchQuery=''; render();
  },
  async doLogin(){
    const email = ($('#li_email')?.value||'').trim();
    const pass = $('#li_pass')?.value||'';
    const { error } = await db.auth.signInWithPassword({ email, password: pass });
    if(error){ $('#authErr').textContent = error.message; return; }
  },
  async doSignup(){
    const data = {
      name:$('#su_name').value.trim(), student_id:$('#su_sid').value.trim(),
      email:$('#su_email').value.trim(), semester:$('#su_sem').value,
      batch:$('#su_batch').value.trim(), password:$('#su_pass').value
    };
    if(!data.name||!data.email||!data.password||!data.student_id){
      $('#authErr').textContent='Please fill all required fields.'; return;
    }
    const { error } = await db.auth.signUp({
      email: data.email,
      password: data.password,
      options: { data: { name:data.name, student_id:data.student_id, role:'student' } }
    });
    if(error){ $('#authErr').textContent = error.message; return; }
    toast('Account created! Check your email to confirm.');
  },
  async logout(){ await db.auth.signOut(); state.user=null; state.profile=null; render(); },
  setSem(v){ state.semFilter=v; render(); },
  setCalSem(v){ state.calSemFilter=v; render(); },
  addStopRow(){
    const container = document.getElementById('stops_container');
    if(!container) return;
    const row = document.createElement('div');
    row.className = 'stop-row';
    row.setAttribute('data-stop-row', '');
    row.innerHTML = `
      <input type="text" placeholder="Stop Name" class="stop-name">
      <input type="time" class="stop-time">
      <button type="button" class="remove-stop" onclick="this.parentElement.remove()">✕</button>`;
    container.appendChild(row);
  },
  addCgpaRow(){
    const grades = ['A+','A','A-','B+','B','B-','C+','C','D','F'];
    const row = document.createElement('div');
    row.className='row'; row.style.marginBottom='8px';
    row.innerHTML = `<input type="number" placeholder="Credits" class="cgpa-credit" value="3">
      <select class="cgpa-grade">${grades.map(g=>`<option>${g}</option>`).join('')}</select>`;
    document.getElementById('cgpaRows').appendChild(row);
  },
  calcCgpa(){
    const credits = [...document.querySelectorAll('.cgpa-credit')].map(i=>Number(i.value)||0);
    const grades = [...document.querySelectorAll('.cgpa-grade')].map(s=>s.value);
    const points = {'A+':4,'A':3.75,'A-':3.5,'B+':3.25,'B':3,'B-':2.75,'C+':2.5,'C':2.25,'D':2,'F':0};
    let totPts=0, totCr=0;
    credits.forEach((cr,i)=>{ totPts += (points[grades[i]]||0)*cr; totCr += cr; });
    const gpa = totCr ? totPts/totCr : 0;
    document.getElementById('cgpaResult').textContent = `GPA: ${gpa.toFixed(2)} (${totCr} credits)`;
  },
  async submitAssignment(assignmentId){
    const file = document.getElementById('sub_file_'+assignmentId)?.files?.[0];
    if(!file){ toast('Select a file first.'); return; }
    const path = await uploadAssignment(file, assignmentId);
    if(!path) return;
    const asg = CACHE.assignments.find(a=>a.id===assignmentId);
    const isLate = new Date() > new Date(asg.due_date);
    const { error } = await db.from('submissions').upsert({
      assignment_id: assignmentId,
      student_id: state.profile.id,
      file_path: path,
      file_name: file.name,
      submitted_at: new Date().toISOString(),
      status: isLate ? 'late' : 'submitted'
    }, { onConflict: 'assignment_id,student_id' });
    if(error){ toast(error.message); return; }
    toast('Submitted!'); await loadAllData(); render();
  },
  async downloadMaterial(path, name){
    const { data, error } = await db.storage.from('study-materials').createSignedUrl(path, 3600);
    if(error){ toast(error.message); return; }
    const a = document.createElement('a');
    a.href = data.signedUrl; a.download = name; a.target='_blank'; a.click();
  },
  async saveAttendance(){
    const courseId = $('#att_course').value;
    const date = $('#att_date').value;
    const statuses = [...document.querySelectorAll('.att_status')].map(s=>({
      student_id: s.getAttribute('data-student'), status: s.value
    }));
    const rows = statuses.map(s=>({
      student_id: s.student_id, course_id: courseId, date, status: s.status,
      marked_by: state.profile.id
    }));
    const { error } = await db.from('attendance').upsert(rows, { onConflict: 'student_id,course_id,date' });
    if(error){ toast(error.message); return; }
    toast('Attendance saved for '+date);
  },
  exportIcs(){
    const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FDT Portal//EN'];
    const dayMap = {Sunday:'SU',Monday:'MO',Tuesday:'TU',Wednesday:'WE',Thursday:'TH',Saturday:'SA'};
    CACHE.routines.filter(r=>r.type==='class').forEach(r => {
      const d = dayMap[r.day]; if(!d) return;
      const st = (r.start_time||'09:00').replace(':','') + '00';
      const et = (r.end_time||'10:00').replace(':','') + '00';
      lines.push('BEGIN:VEVENT');
      lines.push(`SUMMARY:${courseLabel(r.course_id).replace(/,/g,'')}`);
      lines.push(`DTSTART:${todayStr().replace(/-/g,'')}T${st}`);
      lines.push(`DTEND:${todayStr().replace(/-/g,'')}T${et}`);
      lines.push(`RRULE:FREQ=WEEKLY;BYDAY=${d}`);
      lines.push(`LOCATION:Room ${r.room||''}`);
      lines.push('END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    const blob = new Blob([lines.join('\r\n')], {type:'text/calendar'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='fdt-routine.ics'; a.click();
  },
  openModal(entity, id){
    let record=null, mode='create';
    if(id){
      const key = entity==='registered_courses'?'registered':entity;
      record = (CACHE[key]||[]).find(x=>x.id===id); mode='edit';
    }
    state.modal={entity, record, mode}; render();
  },
  closeModal(){ state.modal=null; render(); },
  async saveModal(){
    const {entity, record, mode} = state.modal;
    const schema = SCHEMAS[entity];
    if(!schema) return;
    const data = {};
    let fileToUpload = null;
    schema.fields.forEach(f=>{
      if(f.type==='stops_list'){
        const rows = document.querySelectorAll('[data-stop-row]');
        data[f.k] = Array.from(rows).map(r => ({
          name: r.querySelector('.stop-name').value.trim(),
          time: r.querySelector('.stop-time').value
        })).filter(s => s.name);
        return;
      }
      const el = document.getElementById('fld_'+f.k); if(!el) return;
      if(f.type==='checkbox') data[f.k]=el.checked;
      else if(f.type==='number') data[f.k] = el.value===''?null:Number(el.value);
      else if(f.type==='file'){ if(el.files[0]) fileToUpload = el.files[0]; }
      else data[f.k]=el.value || null;
    });
    const missing = schema.fields.filter(f=>f.req && f.type!=='file' && f.type!=='stops_list' && (data[f.k]===undefined||data[f.k]===null||data[f.k]===''));
    if(missing.length){ toast('Please fill: '+missing.map(f=>f.label).join(', ')); return; }
    if(entity==='materials' && fileToUpload){
      const up = await uploadStudyMaterial(fileToUpload, data.course_id);
      if(!up) return;
      Object.assign(data, up);
    }
    if(mode==='edit'){
      const { error } = await db.from(schema.table).update(data).eq('id', record.id);
      if(error){ toast(error.message); return; }
      toast('Updated');
    } else {
      const { error } = await db.from(schema.table).insert(data);
      if(error){ toast(error.message); return; }
      toast('Created');
    }
    state.modal=null; await loadAllData(); render();
  },
  async deleteRecord(entity, id){
    const schema = SCHEMAS[entity];
    if(!schema) return;
    if(!confirm('Delete this record?')) return;
    const { error } = await db.from(schema.table).delete().eq('id', id);
    if(error){ toast(error.message); return; }
    await loadAllData(); render(); toast('Deleted');
  }
};

/* ---------- PWA ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}

/* ---------- BOOT ---------- */
(async () => {
  await initAuth();
  if(state.user && state.profile){ await loadAllData(); subscribeRealtime(); }
  render();
})();
</script>
